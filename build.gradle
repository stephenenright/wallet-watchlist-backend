apply plugin:'idea'
apply plugin:'java'
apply plugin:'groovy'
apply plugin: "com.diffplug.spotless"

group 'com.github.stephenenright'
version '1.0-SNAPSHOT'

repositories {
	mavenLocal()
	mavenCentral()
}

buildscript {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		maven {
			url "https://jitpack.io"
		}
	}
	dependencies {
		classpath 'com.diffplug.spotless:spotless-plugin-gradle:7.0.2'
	}
}

spotless {
	// optional: limit format enforcement to just the files changed by this feature branch
	//   ratchetFrom 'origin/main'

	format 'misc', {
		// define the files to apply `misc` to
		target '*.md', '.gitignore'

		// define the steps to apply to those files
		trimTrailingWhitespace()
		leadingTabsToSpaces(4) // Takes an integer argument if you don't like 4
		endWithNewline()
		setEncoding('utf-8')
	}
	java {
		target '**/src/**/*.java'
		eclipse()
	}
	groovy {
		target '**/src/**/*.groovy'
		// removes semicolons at the end of lines
		removeSemicolons()
		// the Groovy Eclipse formatter extends the Java Eclipse formatter,
		// so it formats Java files by default (unless `excludeJava` is used).
		greclipse() // Use default greclipse formatter

		// Custom step to format Spock where blocks
		custom 'spock where formatting', { str ->
			// Format the where blocks by ensuring consistent spacing around pipe separators
			// Only replace pipes that are not already properly formatted
			str.replaceAll(/(?<!\s)\|/, " |").replaceAll(/\|(?!\s)/, "| ")
		}

		licenseHeader('/* (C) $YEAR */') // or licenseHeaderFile
	}
	groovyGradle {
		target '*.gradle' // default target of groovyGradle
		greclipse()
	}
}




apply from: 'versions.gradle'
